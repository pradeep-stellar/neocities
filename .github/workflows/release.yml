name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Read VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is empty"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "GORELEASER_CURRENT_TAG=v${version}" >> "$GITHUB_ENV"

      - name: Check tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match VERSION (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Choose GoReleaser mode
        id: goreleaser
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --snapshot --clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.goreleaser.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installables
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: neocities-installables
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
